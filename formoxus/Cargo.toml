[package]
name = "formoxus"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { workspace = true }
facet = { workspace = true }
heck = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }
formoxus-macros = { workspace = true, optional = true }
paste = "1.0.15"

[dev-dependencies]
dioxus-html = { workspace = true }
dioxus-ssr = { workspace = true }
googletest = { workspace = true }
trybuild = { workspace = true }

[features]
# The derive is the whole point of the crate, so it's on by default. Anyone who
# wants only the runtime types can opt out with `default-features = false`.
default = ["derive"]
derive = ["dep:formoxus-macros"]

# Gated so `--no-default-features` skips the derive tests cleanly rather than
# failing to find the macro. With `derive` in `default`, plain `cargo test` runs them.
[[test]]
name = "derive"
required-features = ["derive"]
