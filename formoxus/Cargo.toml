[package]
name = "formoxus"
description = "Reflection-based forms for Dioxus, built at runtime from a model's facet shape instead of a hand-written form struct"
readme = "README.md"
keywords = ["dioxus", "forms", "facet", "reflection", "web"]
categories = ["web-programming", "gui", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
dioxus = { workspace = true }
# For `use_server_cached`: a form's random id is picked once on the server and
# reused by hydration, or the browser would roll its own and split `for`/`id`
# from `aria-describedby`. No features here: `dioxus-server` and
# `dioxus-web/hydrate` switch on this crate's `server`/`web`, and Cargo's
# feature unification hands them to us; with neither, it just runs the closure.
dioxus-fullstack-core = { workspace = true }
# Uploads (`WIDGETS_PLAN.md` part 3): `Multipart<T>`, the request a form with a
# file is sent in. Every half of it is in dioxus-fullstack's DEFAULT build, on
# every target: the server half is axum's `Multipart`, which dioxus-fullstack
# re-exports unconditionally (`dioxus_fullstack::extract`), and the native
# client half (desktop, mobile) is `ClientRequest::new_reqwest_request` and its
# `reqwest`, also ungated. Only the wasm client half is gated, and the wasm
# entry below switches that on. So formoxus has no features of its own for
# this, and a dev forwards nothing (decided at box 10, question (b)). Don't
# turn this into a formoxus feature without rereading that: a dev who forgot to
# forward it would get a build without uploads and no error until one is sent.
dioxus-fullstack = { workspace = true }
facet = { workspace = true }
heck = { workspace = true }
# `serde`: `FormErrors` (inside `WireForm`) uses it for `fields`, and that
# crosses the wire.
indexmap = { workspace = true, features = ["serde"] }
regress = { workspace = true }
serde = { workspace = true }
# An upload's request carries the form's `WireForm` as its first part, in JSON.
serde_json = { workspace = true }
unicase = { workspace = true }
# Not optional: `form!` is the way a form is declared, so a build without the
# macros would be missing the crate's primary entry point rather than merely
# trading convenience for compile time. The old `derive` feature existed to make
# `#[derive(Form)]` skippable; that path no longer exists.
formoxus-macros = { workspace = true }
# The attribute table `form!` checks against at expansion time, read here at run
# time to validate and emit the same attributes.
formoxus-spec = { workspace = true }

# The wasm client half of `Multipart<T>`: a browser `FormData` holding the wire
# JSON and each picked `File`, sent with `ClientRequest::send_js_value`, which
# dioxus-fullstack compiles only under its `web` feature (that feature is just
# `dep:web-sys`). Keyed on the target, not on a feature, because every wasm
# Dioxus build is the web platform; desktop and mobile are native. `JsCast`
# (`wasm-bindgen`) gets the `web_sys::File` out of a `FileData`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-fullstack = { workspace = true, features = ["web"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Blob", "File", "FormData"] }

[features]
# Test-only conveniences, never for a dev: today `NodePath == "a.b"`, so the
# suite's ~350 path literals compare without a constructor each. A feature and
# not `#[cfg(test)]`, because `cfg(test)` is off when the library is built for
# its integration tests, and the suite (a separate crate) cannot write these
# impls itself: the orphan rule. Switched on only by the dev-dependency on this
# crate below, which `cargo publish` drops (it has no version).
__test-util = []

[dev-dependencies]
# This crate, with `__test-util` on, for the suite. See `[features]`.
formoxus = { path = ".", features = ["__test-util"] }
dioxus-html = { workspace = true }
dioxus-ssr = { workspace = true }
googletest = { workspace = true }
trybuild = { workspace = true }
