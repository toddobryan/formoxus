[package]
name = "formoxus-macros"
readme = "README.md"
description = "Proc macros for formoxus: form! and using_fns!. Not useful on its own — depend on `formoxus` instead"
keywords = ["dioxus", "forms", "macros", "facet"]
categories = ["development-tools", "web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
# `extra-traits` for `Debug` on syn types: form.rs derives Debug across its
# parsed spec types, and its 78 parser tests assert on that output. It used to
# arrive transitively through darling; with darling gone it has to be declared.
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
heck = { workspace = true }
regress = { workspace = true }
# Host-only, and deliberately without `reflect`: the only thing needed here is
# `Facet`'s derive and `SHAPE`, so `FieldBody`'s own fields can BE the list of
# legal keys rather than a hand-kept copy of it.
facet = { workspace = true }

[dev-dependencies]
googletest = { workspace = true }
