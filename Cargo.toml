[workspace]
resolver = "2"
members = [
    "formoxus",
    "formoxus-macros",
    "examples",
]
# `examples` is a member so it is always COMPILED and cannot rot, but it is not
# a DEFAULT member, so a bare `cargo test` in the edit loop skips it. Reach it
# with `--workspace` (what CI should run) or `-p formoxus-examples`.
default-members = [
    "formoxus",
    "formoxus-macros",
]

# Shared by both published crates, so a version bump or a license change is one
# edit rather than two that can drift.
[workspace.package]
version = "0.1.0"
edition = "2024"
# facet 0.46.5 requires 1.90 and is the highest floor in the tree (dioxus asks
# only 1.83). Derived from the dependency, NOT verified by building on 1.90.
rust-version = "1.90"
authors = ["Todd O'Bryan <toddobryan@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/toddobryan/formoxus"

# Applied to every member via `lints.workspace = true`. `just ci` runs clippy
# with `-D warnings`, so everything here fails the build rather than scrolling
# past.
[workspace.lints.rust]
# A group, so it needs a lower priority than the individual lints below it.
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
# NOT unused_qualifications. It has a false-positive class in any rsx-heavy
# crate: it fires inside `rsx!`'s expansion and blames the nearest token it can
# map back to, so the suggested fix for `onsubmit: move |e| …` is to delete
# `onsubmit:`. 24 of those, across seven modules, against 13 real findings that
# were all cosmetic and all in tests. Silencing it would have meant a
# module-level allow in every widget file — blinding exactly the code most
# likely to grow a real one.
#
# Sweep for new REAL ones now and then; the artifacts all sit on a closure:
#   cargo clippy --workspace --all-targets -- -W unused_qualifications 2>&1 \
#     | grep -B1 "move |\||_|" -v
unused_lifetimes = "warn"
# NOT trivial_casts: every hit is `Box<FormField<T>> as Box<dyn FormMember>`
# in `dispatch!`, where the cast is what picks the trait object.
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Bans `mod.rs`. NB both this and `self_named_module_files` are named for the
# layout they REJECT, not the one they enforce — the other one would demand
# `form.rs` become `form/mod.rs`.
mod_module_files = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# The `must_use` family — 80-odd annotations on a builder-heavy API, none of
# which would catch a bug the types do not already.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Both want prose this crate has not written yet. They belong to the doc pass
# (see `.claude/memory/pre_publish_checklist.md`), not to a lint sweep.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
dioxus = { version = "0.7.10" }
dioxus-ssr = { version = "0.7" }
# dev-only: the `serialize` feature ships SerializedHtmlEventConverter, which is
# what lets a bare VirtualDom dispatch a real DOM event in a test.
dioxus-html = { version = "0.7", features = ["serialize"] }
# Features are NOT set here: `formoxus` needs `reflect` and `formoxus-macros`
# does not — it only reads `SHAPE` — and a proc-macro crate builds for the host,
# so resolver 2 keeps facet-reflect out of that build entirely.
facet = { version = "0.46.5" }
googletest = { version = "0.14.3", features = ["proptest"] }
heck = { version = "0.5.0" }
# Ordered map: preserves declaration order (so a `FormSpec`'s Debug output and
# any future field-ordering customization are stable) while still overwriting on
# duplicate insert, which a Vec of pairs would not. Already in the lock
# transitively, so declaring it costs nothing to build.
indexmap = { version = "2" }
serde = { version = "1", features = ["derive"] }
# dev-only: `WireForm` is what crosses a server-fn boundary, so a test has to
# prove it survives a real serializer rather than just deriving the impls.
regress = { version = "0.12.0" }
serde_json = { version = "1" }
trybuild = { version = "1.0.116" }

# workspace. The `version` is required as well as the `path`: on publish cargo
# strips the path and the released crate resolves its macros from crates.io, so
# a bare path dependency is rejected by `cargo package`. Bump it with
# `workspace.package.version` — nothing enforces that they agree.
formoxus-macros = { path = "formoxus-macros", version = "0.1.0" }
